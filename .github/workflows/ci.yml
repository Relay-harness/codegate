name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create project environment
        run: python3 -m venv .venv
      - name: Run CodeGate checks
        run: .venv/bin/python codegate.py check --json
