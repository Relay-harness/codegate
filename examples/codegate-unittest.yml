name: CodeGate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  codegate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run project quality gate
        run: python3 .codegate/runner.py check --json
